[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[project]
name = "ledgerproof-backend"
version = "0.1.0"
description = "Django/DRF backend for the LedgerProof finance assistant prototype."
requires-python = ">=3.12"
dependencies = [
  "Django>=5.1,<6.0",
  "djangorestframework>=3.15,<4.0",
  "psycopg[binary]>=3.2,<4.0",
  "pydantic>=2.8,<3.0",
  "PyYAML>=6.0,<7.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9.0",
  "pytest-django>=4.9,<5.0",
  "ruff>=0.8,<1.0",
  "mypy>=1.13,<2.0",
  "django-stubs>=5.1,<6.0",
  "djangorestframework-stubs>=3.15,<4.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["config*", "finance_assistant*"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.test"
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = []

[tool.mypy]
python_version = "3.12"
plugins = ["mypy_django_plugin.main"]
strict = true
warn_unused_ignores = true
warn_redundant_casts = true
exclude = [".venv", "migrations"]

[tool.django-stubs]
django_settings_module = "config.settings.test"
