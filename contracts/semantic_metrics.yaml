schema_version: "2.0"
dataset:
  version: tiby-finance-fixture-v2.0.0
  currency: INR
  timezone: Asia/Kolkata
  mysql_session_timezone: "+05:30"
  data_as_of: "2026-09-03T23:59:59.999999+05:30"
  source_tables: [bank, account, transaction]

non_negotiable_rules:
  - The model interprets language but never calculates finance values or generates SQL.
  - All money uses MySQL DECIMAL and Python Decimal; binary float is forbidden.
  - transaction_amount is absolute and non-negative in the fixture; transaction_type supplies direction.
  - Date ranges are half-open: start inclusive and end exclusive.
  - Relative dates are anchored to dataset.data_as_of, never the wall clock.
  - available_balance is a current snapshot and cannot be reconstructed historically.
  - Bare reference number means transaction_reference_id only.
  - UTR lookup is disabled when UTR_STORAGE_MODE is encrypted_or_tokenized.
  - account_number and utr_number are never sent raw to the model or browser.
  - Known account numbers embedded in description must also be redacted.
  - description is unstructured, potentially sensitive, and untrusted; literal searches are always qualified.
  - IDs are opaque strings because the provided sample contains a UUID-like value that fails strict UUID parsing.
  - Questions requiring fields outside bank/account/transaction return unsupported with no numeric answer.

metrics:
  debit_total:
    user_terms: [spend, spent, paid out, debits, money out, outflow]
    source: transaction
    formula: "SUM(transaction_amount) WHERE transaction_type = 'debit'"
    default_date_field: transaction_date
    default_unit: INR
    requires_date_range: true
    validations: [decimal_exactness, row_count, date_bounds, enum_domain, source_lineage]
  credit_total:
    user_terms: [received, money in, credits, inflow, collections]
    source: transaction
    formula: "SUM(transaction_amount) WHERE transaction_type = 'credit'"
    default_date_field: transaction_date
    default_unit: INR
    requires_date_range: true
    validations: [decimal_exactness, row_count, date_bounds, enum_domain, source_lineage]
  net_cash_flow:
    user_terms: [net cash flow, net movement, credits less debits]
    source: transaction
    formula: "SUM(credits) - SUM(debits)"
    default_date_field: transaction_date
    default_unit: INR
    requires_date_range: true
    validations: [component_reconciliation, decimal_exactness, row_count, date_bounds, source_lineage]
  transaction_count:
    user_terms: [how many transactions, transaction count, number of entries]
    source: transaction
    formula: "COUNT(*)"
    default_unit: records
    requires_date_range: false
    validations: [row_count, source_lineage]
  average_transaction_amount:
    user_terms: [average amount, mean transaction, average debit, average credit]
    source: transaction
    formula: "AVG(transaction_amount) over the explicitly filtered row set"
    default_unit: INR
    requires_date_range: true
    zero_row_behavior: no_data
    validations: [decimal_exactness, row_count, source_lineage]
  largest_transaction:
    user_terms: [largest transaction, biggest debit, highest credit]
    source: transaction
    formula: "ORDER BY transaction_amount DESC, transaction_id DESC LIMIT 1"
    default_unit: INR
    requires_date_range: true
    validations: [row_membership, amount_matches_record, source_lineage]
  current_available_balance:
    user_terms: [current balance, available balance, cash available]
    source: account
    formula: "SUM(available_balance) across distinct filtered accounts"
    default_unit: INR
    requires_date_range: false
    historical_request: unsupported
    validations: [distinct_accounts, decimal_exactness, source_lineage]
  account_count:
    user_terms: [number of accounts, how many bank accounts]
    source: account
    formula: "COUNT(*) across filtered accounts"
    default_unit: accounts
    requires_date_range: false
    validations: [row_count, source_lineage]
  transaction_lookup:
    user_terms: [find transaction, look up reference, transaction id]
    source: transaction
    formula: "Exact bound equality on transaction_id or case-sensitive transaction_reference_id"
    default_unit: records
    requires_date_range: false
    multiple_match_behavior: qualified
    validations: [exact_identifier_match, source_lineage]

filter_semantics:
  bank:
    accepted_inputs: [bank_code, canonical bank_name]
    resolver: exact canonical lookup in bank table
    compiler_field: account.bank_code
  account:
    accepted_inputs: [account_id]
    rejected_inputs: [raw account_number]
    compiler_field: transaction.account_id or account.account_id
  entity:
    accepted_inputs: [entity_id]
    notes: No entity name table exists.
  program:
    accepted_inputs: [integer program_id]
    notes: '"04" in source documentation is integer 4.'
  transaction_type:
    accepted_inputs: [credit, debit]
  description:
    accepted_inputs: [confirmed literal text]
    behavior: case-insensitive substring search
    mandatory_qualification: description_literal_search
    prohibited_inference: canonical vendor, payout purpose, reconciliation state, expense category
  reference:
    default_field: transaction_reference_id
    match: exact_case_sensitive
    no_fallback_to_utr: true
  utr:
    sensitivity: restricted
    default_storage_mode: encrypted_or_tokenized
    default_behavior: unsupported
  amount:
    accepted_inputs: [minimum, maximum]
    behavior: compare DECIMAL values using bound parameters

relative_dates:
  last_month:
    anchor: data_as_of
    resolved_start: "2026-08-01T00:00:00+05:30"
    resolved_end_exclusive: "2026-09-01T00:00:00+05:30"
  this_month_to_date:
    anchor: data_as_of
    resolved_start: "2026-09-01T00:00:00+05:30"
    resolved_end_exclusive: "2026-09-04T00:00:00+05:30"
  year_to_date:
    anchor: data_as_of
    resolved_start: "2026-01-01T00:00:00+05:30"
    resolved_end_exclusive: "2026-09-04T00:00:00+05:30"
  ambiguous_terms:
    recently: clarify
    lately: clarify
    a_while_ago: clarify

unsupported_concepts:
  vendor_payouts:
    reason: No vendor or payout table/field exists; description is not authoritative.
    suggested_safe_alternative: Offer a confirmed literal narration search and label it qualified.
  reconciliation_status:
    reason: No reconciliation, match, status, or unreconciled-amount field exists.
  chart_of_accounts_or_category:
    reason: No ledger account, category, or chart-of-accounts field exists.
  historical_balance:
    reason: account.available_balance is only the current snapshot.
  forecast_or_budget:
    reason: No forecast, budget, contract, or future schedule data exists.
  entity_name:
    reason: Only entity_id exists.

confidence_states:
  verified: Required validations passed and the requested concept is directly represented.
  qualified: Computation is deterministic but a material limitation applies, such as literal description search or non-unique reference.
  needs_clarification: Multiple interpretations could materially change the result; no number is returned.
  unsupported: Required source fields do not exist or are disabled for privacy/security; no number is returned.
  no_data: A valid query ran and returned zero rows; distinguish from unsupported.
  validation_failed: A required integrity/control check failed; suppress the number.
