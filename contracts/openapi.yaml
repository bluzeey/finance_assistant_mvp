openapi: 3.1.0
info:
  title: LedgerProof / Tiby Finance Assistant API
  version: 2.0.0
  description: |
    Contract for a grounded finance assistant over the organiser-provided MySQL
    tables `bank`, `account`, and `transaction`. Every assistant response is an
    AnswerReceipt. Unsupported source concepts return no numeric answer.
servers:
  - url: http://localhost:8000/api/v1
    description: Local Django development server
tags:
  - name: Assistant
  - name: Finance data
  - name: Metadata
  - name: Evaluation
paths:
  /metadata:
    get:
      tags: [Metadata]
      operationId: getMetadata
      summary: Return dataset scope, version, freshness and supported capabilities.
      responses:
        '200':
          description: Dataset metadata.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Metadata'
  /banks:
    get:
      tags: [Finance data]
      operationId: listBanks
      summary: List canonical banks present in the source table.
      responses:
        '200':
          description: Banks.
          content:
            application/json:
              schema:
                type: object
                required: [results]
                properties:
                  results:
                    type: array
                    items:
                      $ref: '#/components/schemas/Bank'
  /accounts:
    get:
      tags: [Finance data]
      operationId: listAccounts
      summary: List accounts with masked account numbers.
      parameters:
        - $ref: '#/components/parameters/BankCode'
        - $ref: '#/components/parameters/EntityId'
        - $ref: '#/components/parameters/ProgramId'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: Masked account rows and pagination cursor.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountPage'
        '400':
          $ref: '#/components/responses/Problem'
  /transactions:
    get:
      tags: [Finance data]
      operationId: listTransactions
      summary: Explore sanitized transaction rows using allow-listed filters.
      parameters:
        - $ref: '#/components/parameters/Start'
        - $ref: '#/components/parameters/EndExclusive'
        - $ref: '#/components/parameters/TransactionType'
        - $ref: '#/components/parameters/BankCode'
        - $ref: '#/components/parameters/AccountId'
        - $ref: '#/components/parameters/EntityId'
        - $ref: '#/components/parameters/ProgramId'
        - name: transaction_reference_id
          in: query
          schema: {type: string, maxLength: 64}
          description: Exact, case-sensitive plaintext reference lookup.
        - name: description_contains
          in: query
          schema: {type: string, minLength: 2, maxLength: 100}
          description: Literal unstructured narration search. The response is qualified.
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: Sanitized, keyset-paginated transaction records.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransactionPage'
        '400':
          $ref: '#/components/responses/Problem'
  /data-health:
    get:
      tags: [Finance data]
      operationId: getDataHealth
      summary: Return freshness, nulls, duplicate risks, FK checks and privacy findings.
      responses:
        '200':
          description: Data-health report.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DataHealth'
  /assistant/messages:
    post:
      tags: [Assistant]
      operationId: sendAssistantMessage
      summary: Interpret, resolve, execute, validate and return one immutable answer receipt.
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          schema: {type: string, minLength: 8, maxLength: 128}
        - name: If-Match-Context-Version
          in: header
          required: true
          schema: {type: integer, minimum: 0}
          description: Prevents an older response from overwriting newer conversation context.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AssistantMessageRequest'
      responses:
        '200':
          description: Verified, qualified, clarification, unsupported, no-data or validation-failed receipt.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnswerReceipt'
        '409':
          description: Context version is stale.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '422':
          $ref: '#/components/responses/Problem'
        '429':
          $ref: '#/components/responses/Problem'
        '503':
          $ref: '#/components/responses/Problem'
  /assistant/conversations/{conversation_id}/state:
    get:
      tags: [Assistant]
      operationId: getConversationState
      parameters:
        - name: conversation_id
          in: path
          required: true
          schema: {type: string, maxLength: 128}
      responses:
        '200':
          description: Authoritative server conversation state.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QueryState'
        '404':
          $ref: '#/components/responses/Problem'
  /assistant/receipts/{query_id}:
    get:
      tags: [Assistant]
      operationId: getAnswerReceipt
      parameters:
        - $ref: '#/components/parameters/QueryId'
      responses:
        '200':
          description: Immutable answer receipt.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnswerReceipt'
        '404':
          $ref: '#/components/responses/Problem'
  /assistant/receipts/{query_id}/records:
    get:
      tags: [Assistant]
      operationId: getReceiptRecords
      summary: Re-run the immutable receipt predicate and return sanitized source records.
      parameters:
        - $ref: '#/components/parameters/QueryId'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: Receipt-scoped source records.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransactionPage'
        '404':
          $ref: '#/components/responses/Problem'
        '409':
          description: Dataset changed and receipt cannot be reproduced exactly.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
  /assistant/receipts/{query_id}/export:
    get:
      tags: [Assistant]
      operationId: exportReceiptRecords
      summary: Export sanitized records matching the immutable receipt.
      parameters:
        - $ref: '#/components/parameters/QueryId'
        - name: format
          in: query
          required: true
          schema: {enum: [csv, xlsx]}
      responses:
        '200':
          description: Export file. Raw account numbers and UTR values are never included.
          content:
            text/csv:
              schema: {type: string, format: binary}
            application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
              schema: {type: string, format: binary}
        '404':
          $ref: '#/components/responses/Problem'
        '410':
          $ref: '#/components/responses/Problem'
  /evaluation/runs:
    post:
      tags: [Evaluation]
      operationId: runEvaluation
      summary: Run the configured model/parser against gold cases outside application runtime.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [model, prompt_version, case_ids]
              properties:
                model: {type: string}
                prompt_version: {type: string}
                case_ids:
                  type: array
                  maxItems: 100
                  items: {type: string}
      responses:
        '202':
          description: Evaluation accepted.
          content:
            application/json:
              schema:
                type: object
                required: [run_id, status]
                properties:
                  run_id: {type: string}
                  status: {const: queued}
components:
  parameters:
    QueryId:
      name: query_id
      in: path
      required: true
      schema: {type: string, maxLength: 128}
    Start:
      name: start
      in: query
      schema: {type: string, format: date-time}
    EndExclusive:
      name: end_exclusive
      in: query
      schema: {type: string, format: date-time}
    TransactionType:
      name: transaction_type
      in: query
      schema: {enum: [credit, debit]}
    BankCode:
      name: bank_code
      in: query
      schema:
        enum: [HDFC, ICIC, SBIN, UTIB, KKBK, CNRB, UBIN, AUBL, TMBL, RATN]
    AccountId:
      name: account_id
      in: query
      schema: {type: string, maxLength: 36}
    EntityId:
      name: entity_id
      in: query
      schema: {type: string, maxLength: 36}
    ProgramId:
      name: program_id
      in: query
      schema: {type: integer}
    Cursor:
      name: cursor
      in: query
      schema: {type: string}
    PageSize:
      name: page_size
      in: query
      schema: {type: integer, minimum: 1, maximum: 100, default: 50}
  responses:
    Problem:
      description: RFC 9457-style application problem.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
  schemas:
    Bank:
      type: object
      additionalProperties: false
      required: [bank_code, bank_name]
      properties:
        bank_code: {type: string}
        bank_name: {type: string}
    Account:
      type: object
      additionalProperties: false
      required: [account_id, entity_id, masked_account_number, program_id, available_balance, bank_code, bank_name]
      properties:
        account_id: {type: string}
        entity_id: {type: string}
        masked_account_number: {type: string, example: '••••••••••9069'}
        program_id: {type: integer}
        available_balance: {type: string, pattern: '^-?\d+\.\d{2}$'}
        bank_code: {type: string}
        bank_name: {type: string}
    AccountPage:
      type: object
      required: [results, next_cursor]
      properties:
        results:
          type: array
          items: {$ref: '#/components/schemas/Account'}
        next_cursor: {type: [string, 'null']}
    Transaction:
      type: object
      additionalProperties: false
      required: [transaction_id, account_id, masked_account_number, bank_code, bank_name, entity_id, program_id, transaction_date, transaction_type, description, transaction_amount, transaction_reference_id, masked_utr_number]
      properties:
        transaction_id: {type: string}
        account_id: {type: string}
        masked_account_number: {type: string}
        bank_code: {type: string}
        bank_name: {type: string}
        entity_id: {type: string}
        program_id: {type: integer}
        transaction_date: {type: string, format: date-time}
        transaction_type: {enum: [credit, debit]}
        description: {type: [string, 'null'], description: Escaped and account-number-redacted narration.}
        transaction_amount: {type: string, pattern: '^\d+\.\d{2}$'}
        transaction_reference_id: {type: [string, 'null']}
        masked_utr_number: {type: [string, 'null']}
    TransactionPage:
      type: object
      required: [results, next_cursor, qualification, receipt_source_row_count]
      properties:
        results:
          type: array
          items: {$ref: '#/components/schemas/Transaction'}
        next_cursor: {type: [string, 'null']}
        qualification: {type: [string, 'null']}
        receipt_source_row_count: {type: [integer, 'null']}
    AssistantMessageRequest:
      type: object
      additionalProperties: false
      required: [conversation_id, message_id, text]
      properties:
        conversation_id: {type: string, minLength: 1, maxLength: 128}
        message_id: {type: string, minLength: 1, maxLength: 128}
        text: {type: string, minLength: 1, maxLength: 2000}
        locale: {type: string, default: en-IN}
        timezone: {const: Asia/Kolkata}
    Metadata:
      type: object
      required: [dataset_version, data_as_of, currency, timezone, source_tables, supported_metrics, unsupported_concepts]
      properties:
        dataset_version: {const: tiby-finance-fixture-v2.0.0}
        data_as_of: {type: string, format: date-time}
        currency: {const: INR}
        timezone: {const: Asia/Kolkata}
        source_tables:
          type: array
          items: {enum: [bank, account, transaction]}
        supported_metrics:
          type: array
          items: {type: string}
        unsupported_concepts:
          type: array
          items: {type: object}
    DataHealth:
      type: object
      required: [status, data_as_of, row_counts, checks]
      properties:
        status: {enum: [healthy, qualified, unhealthy]}
        data_as_of: {type: string, format: date-time}
        row_counts: {type: object}
        checks:
          type: array
          items:
            type: object
            required: [id, status, detail]
            properties:
              id: {type: string}
              status: {enum: [pass, warn, fail]}
              detail: {type: string}
    QueryState:
      $ref: './query_state.schema.json'
    AnswerReceipt:
      $ref: './answer_receipt.schema.json'
    ProblemDetails:
      $ref: './problem_details.schema.json'
