name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e 'backend[dev]'
          pip install -r requirements-tools.txt
      - name: Validate repository and fixture contracts
        run: |
          python scripts/validate_dataset.py
          python scripts/validate_repository.py
      - name: Backend tests and quality gates
        working-directory: backend
        run: |
          pytest
          ruff check .
          mypy .

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Verify generated API types are current
        working-directory: frontend
        run: |
          npm run generate:types
          git diff --exit-code -- src/api/generated-types.ts
      - name: Frontend typecheck and unit tests
        working-directory: frontend
        run: |
          npm audit --omit=dev
          npm run typecheck
          npm test
      - name: Frontend Playwright smoke
        working-directory: frontend
        run: |
          npx playwright install chromium
          npm run e2e -- --project=chromium
